<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CareNotes · Sign in</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<main class="auth-wrap">
		<div class="card auth-card">
			<div class="brand"><span class="brand-mark">+</span> CareNotes</div>
			<p class="muted" style="text-align:center">Visit notes, medications and mood check-ins between your psychiatry appointments.</p>

			<div class="tabs">
				<button type="button" class="tab active" data-tab="login">Sign in</button>
				<button type="button" class="tab" data-tab="register">New patient</button>
			</div>

			<div id="message" class="message" hidden></div>

			<!-- Shown only when Firebase is configured on the server -->
			<div id="google-area" hidden>
				<button type="button" id="google-btn" class="btn-google btn-block">
					<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
					Continue with Google
				</button>
				<div class="divider"><span>or use email</span></div>
			</div>

			<form id="login-form">
				<div class="field">
					<label for="login-email">Email</label>
					<input id="login-email" type="email" required autocomplete="email">
				</div>
				<div class="field">
					<label for="login-password">Password</label>
					<input id="login-password" type="password" required autocomplete="current-password">
				</div>
				<button type="submit" class="btn-block">Sign in</button>
			</form>

			<form id="register-form" hidden>
				<div class="row">
					<div class="field">
						<label for="reg-first">First name</label>
						<input id="reg-first" required>
					</div>
					<div class="field">
						<label for="reg-last">Last name</label>
						<input id="reg-last" required>
					</div>
				</div>
				<div class="field">
					<label for="reg-email">Email</label>
					<input id="reg-email" type="email" required autocomplete="email">
				</div>
				<div class="row">
					<div class="field">
						<label for="reg-mobile">Mobile number</label>
						<input id="reg-mobile" required>
					</div>
					<div class="field">
						<label for="reg-dob">Date of birth</label>
						<input id="reg-dob" type="date">
					</div>
				</div>
				<div class="field">
					<label for="reg-password">Password <span class="field-hint">(at least 8 characters)</span></label>
					<input id="reg-password" type="password" minlength="8" required autocomplete="new-password">
				</div>
				<button type="submit" class="btn-block">Create account</button>
			</form>

			<div class="demo-box" style="margin-top:1.25rem">
				<strong>Demo accounts</strong> (password <code>Demo1234!</code>)<br>
				Psychiatrist: <code>doctor@demo.com</code><br>
				Patient: <code>patient@demo.com</code>
			</div>
		</div>
	</main>

	<script src="app.js"></script>
	<script>
		const message = document.getElementById("message");
		const loginForm = document.getElementById("login-form");
		const registerForm = document.getElementById("register-form");

		// Already logged in? Go straight to the right dashboard
		if(getToken() && getRole()) {
			window.location.href = getRole() === "doctor" ? "doctor.html" : "patient.html";
		}

		document.querySelectorAll(".tab").forEach(tab => {
			tab.addEventListener("click", () => {
				document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
				loginForm.hidden = tab.dataset.tab !== "login";
				registerForm.hidden = tab.dataset.tab !== "register";
				showMessage(message, "");
			});
		});

		const login = (email, password) => {
			return api("/users/login", { method: "POST", body: { email, password } })
			.then(data => {
				saveSession(data.access, data.role);
				window.location.href = data.role === "doctor" ? "doctor.html" : "patient.html";
			});
		};

		loginForm.addEventListener("submit", (e) => {
			e.preventDefault();
			showMessage(message, "");
			login(
				document.getElementById("login-email").value,
				document.getElementById("login-password").value
			)
			.catch(err => showMessage(message, err.message));
		});

		registerForm.addEventListener("submit", (e) => {
			e.preventDefault();
			showMessage(message, "");

			let email = document.getElementById("reg-email").value;
			let password = document.getElementById("reg-password").value;

			api("/users/register", {
				method: "POST",
				body: {
					firstName: document.getElementById("reg-first").value,
					lastName: document.getElementById("reg-last").value,
					email,
					mobileNo: document.getElementById("reg-mobile").value,
					dateOfBirth: document.getElementById("reg-dob").value || undefined,
					password
				}
			})
			.then(() => login(email, password))
			.catch(err => showMessage(message, err.message));
		});
	</script>

	<!-- Google sign-in with Firebase: get a Firebase ID token, then trade it for our own access token -->
	<script type="module">
		const FIREBASE_VERSION = "10.12.2";

		api("/users/firebase-config")
		.then(config => {
			if(!config.enabled) return;

			document.getElementById("google-area").hidden = false;

			Promise.all([
				import(`https://www.gstatic.com/firebasejs/${ FIREBASE_VERSION }/firebase-app.js`),
				import(`https://www.gstatic.com/firebasejs/${ FIREBASE_VERSION }/firebase-auth.js`)
			])
			.then(([{ initializeApp }, { getAuth, GoogleAuthProvider, signInWithPopup, signOut }]) => {
				const firebaseAuth = getAuth(initializeApp(config));
				const googleBtn = document.getElementById("google-btn");

				googleBtn.addEventListener("click", () => {
					showMessage(message, "");
					googleBtn.disabled = true;

					signInWithPopup(firebaseAuth, new GoogleAuthProvider())
					.then(result => result.user.getIdToken())
					.then(idToken => api("/users/google", { method: "POST", body: { idToken } }))
					.then(data => {
						// Our app uses its own token from here on, so the Firebase session isn't needed
						signOut(firebaseAuth);
						saveSession(data.access, data.role);
						window.location.href = data.role === "doctor" ? "doctor.html" : "patient.html";
					})
					.catch(err => {
						if(err.code !== "auth/popup-closed-by-user" && err.code !== "auth/cancelled-popup-request") {
							showMessage(message, err.code === "auth/unauthorized-domain"
								? "Google sign-in isn't allowed on this website yet. Add this domain in Firebase > Authentication > Settings > Authorized domains."
								: err.message);
						}
					})
					.finally(() => { googleBtn.disabled = false; });
				});
			})
			.catch(() => showMessage(message, "Couldn't load Google sign-in. Check your connection and try again."));
		})
		.catch(() => {});
	</script>
</body>
</html>
